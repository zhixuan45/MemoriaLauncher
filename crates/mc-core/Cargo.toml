[package]
name = "mc-core"
version = "0.1.0"
edition = "2021"
description = "Core domain models, services, and task definitions for MC AI Launcher"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
regex = "1.13"
sha1 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }
mc-launcher-core = { path = "../vendor/mc-launcher-core" }
