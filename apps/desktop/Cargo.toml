[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
mc-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
url = "2.5"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "x11", "wayland", "image-without-codecs", "svg", "tokio", "advanced-shaping", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
iced_test = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

