[workspace]
members = [
    "crates/mc-core",
    "apps/desktop",
    "crates/mc-mcp",
]
resolver = "2"

[workspace.dependencies]
# 异步运行时与工具
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# 序列化与数据处理
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# 错误处理与日志
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# 本地模块
mc-core = { path = "crates/mc-core" }

# MSVC can fail with D8050 when cc-rs emits /Z7 for ring's native code.
# Keep debug information for our Rust code while disabling it for ring only.
[profile.dev.package.ring]
debug = 0
